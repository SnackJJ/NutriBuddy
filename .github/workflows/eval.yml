name: Eval

on:
  push:
    branches:
      - main
      - "sandcastle/**"
  pull_request:
    branches:
      - main

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Eval framework (stub mode)
        run: npm run eval
